name: Build unsigned release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios-simulator
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
      - name: Install desktop packager
        if: matrix.target == 'windows'
        run: python -m pip install pyinstaller==6.22.3
      - name: Package Windows executable
        if: matrix.target == 'windows'
        run: flet pack main.py --name CipherVault --product-name "Cipher Vault" --product-version 0.3.1 --file-version 0.3.1.0 --distpath build/windows --yes
      - name: Validate packaged Windows crypto runtime
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $candidate = Start-Process -FilePath ./build/windows/CipherVault.exe -ArgumentList '--self-test','build/windows/runtime-check.json' -WindowStyle Hidden -Wait -PassThru
          if ($candidate.ExitCode -ne 0) { throw 'Packaged runtime check failed' }
          if (-not (Test-Path ./build/windows/runtime-check.json)) { throw 'Runtime report missing' }
      - name: Build candidate (not a signed distribution)
        if: matrix.target != 'windows'
        run: flet build ${{ matrix.target }} --python-version 3.14 --build-version 0.3.1 --build-number 4 --yes --no-rich-output
      - uses: actions/upload-artifact@v4
        with:
          name: cipher-vault-${{ matrix.target }}-candidate
          path: build/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
